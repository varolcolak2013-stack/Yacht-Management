<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yat Yönetim">
<meta name="theme-color" content="#0B1C2B">
<title>Yat Yönetim — Kaptan Köşesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230B1C2B'/%3E%3Cg stroke='%23C89B5C' stroke-width='9' fill='none' stroke-linecap='round'%3E%3Ccircle cx='90' cy='42' r='13'/%3E%3Cline x1='90' y1='55' x2='90' y2='140'/%3E%3Cline x1='58' y1='78' x2='122' y2='78'/%3E%3Cpath d='M42 108a48 48 0 0 0 96 0'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --navy-deep:#0B1C2B; --navy:#0E2233; --navy-card:#132C40; --line:#1E3A52;
    --line-soft:#2A4258; --brass:#C89B5C; --chart:#EDE6D6; --muted:#8FA3B0;
    --dim:#5C7085; --rust:#C1440E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--navy);color:var(--chart);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  .display{font-family:'Fraunces',Georgia,serif}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  ::selection{background:var(--brass);color:var(--navy)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}

  .shell{display:flex;min-height:100vh}
  aside{width:252px;flex-shrink:0;background:var(--navy-deep);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:30px 22px 20px;border-bottom:1px solid var(--line)}
  .brand .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
  .brand h1{font-size:23px;font-weight:600;margin-top:8px}
  nav.side{flex:1;padding:12px 0;overflow-y:auto}
  .navbtn{width:100%;display:flex;align-items:center;gap:11px;padding:12px 22px;text-align:left;color:var(--dim);position:relative}
  .navbtn.on{background:var(--navy-card);color:var(--chart)}
  .navbtn.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass)}
  .navbtn .brg{font-size:10px;letter-spacing:.1em;color:var(--dim);display:block;margin-top:2px}
  .navbtn.on .brg{color:var(--brass)}
  .sidefoot{padding:16px 22px;border-top:1px solid var(--line);font-size:10px;letter-spacing:.1em;color:#4A5D6E}
  main{flex:1;min-width:0}
  header.top{padding:28px 38px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
  header.top .brg{font-size:11px;letter-spacing:.2em;color:var(--brass)}
  header.top h2{font-family:'Fraunces',serif;font-size:29px;font-weight:600;margin-top:5px}
  .wrap{padding:26px 38px 90px;max-width:1080px}

  .tabbar{display:none}
  @media(max-width:860px){
    aside{display:none}
    header.top{padding:calc(18px + env(safe-area-inset-top)) 18px 14px}
    header.top h2{font-size:23px}
    .wrap{padding:18px 18px 120px}
    .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--navy-deep);
      border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);overflow-x:auto}
    .tabbar button{flex:1;min-width:62px;padding:10px 3px 9px;display:flex;flex-direction:column;
      align-items:center;gap:3px;color:var(--dim);font-size:9.5px}
    .tabbar button.on{color:var(--brass)}
    .grid2{grid-template-columns:1fr !important}
    .stats{flex-wrap:wrap}
    .stats .card{min-width:44%}
  }

  .card{background:var(--navy-card);border:1px solid var(--line);border-radius:3px;padding:18px}
  .stats{display:flex;gap:12px;margin-bottom:20px}
  .stats .card{flex:1}
  .lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-family:'JetBrains Mono',monospace}
  .bignum{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1;margin-top:7px}
  .bignum span{font-family:'Inter',sans-serif;font-size:11px;font-weight:400;color:var(--dim);margin-left:5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:3px;background:var(--brass);
    color:var(--navy);font-size:13px;font-weight:600}
  .btn:active{opacity:.75}
  .btn.ghost{background:transparent;border:1px solid var(--line-soft);color:var(--muted);font-weight:500}
  .btn.sm{padding:6px 10px;font-size:12px}
  .del{color:var(--dim);padding:5px;border-radius:3px}
  .del:active{color:var(--rust)}
  .langsel{background:transparent;border:1px solid var(--line-soft);color:var(--muted);font-size:11px;
    border-radius:3px;padding:7px 8px;outline:none}
  .langsel:focus{border-color:var(--brass)}

  .lockscreen{position:fixed;inset:0;z-index:200;background:var(--navy-deep);display:flex;
    align-items:center;justify-content:center;padding:24px}
  .lockscreen.hidden{display:none}
  .lockbox{width:100%;max-width:340px;background:var(--navy-card);border:1px solid var(--line);
    border-radius:6px;padding:30px 26px}
  .lockicon{width:52px;height:52px;border-radius:50%;border:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  label.f{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
  label.f>span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-family:'JetBrains Mono',monospace}
  input.f,textarea.f,select.f{background:var(--navy);border:1px solid var(--line-soft);border-radius:3px;
    padding:9px 11px;font-size:14px;color:var(--chart);outline:none;width:100%}
  input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--brass)}
  textarea.f{resize:vertical;min-height:70px;line-height:1.55}
  .empty{border:1px dashed var(--line-soft);border-radius:3px;padding:40px 18px;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.07em;color:var(--dim)}
  .chip{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 9px;border-radius:3px;background:var(--navy);color:var(--muted);display:inline-block}
  .chip.on{background:var(--brass);color:var(--navy);font-weight:600}
  .itemname{font-family:'Fraunces',serif;font-size:18px;font-weight:600}
  .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin-top:4px}
  .stack>*+*{margin-top:13px}
  .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;background:var(--navy);border:1px solid var(--line)}
  .filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:11px}
  .filecard{position:relative;background:var(--navy-card);border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .filecard .cap{padding:7px 9px;font-size:11px;color:var(--muted);word-break:break-word}
  .filecard .x{position:absolute;top:5px;right:5px;background:rgba(11,28,43,.85);border-radius:3px;padding:4px;color:var(--muted)}
  .docicon{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:var(--navy);border-bottom:1px solid var(--line)}
  .hint{font-size:12.5px;color:var(--dim);line-height:1.6}
  .daycard{border:1px solid var(--line);border-radius:3px;background:var(--navy-card);padding:16px;margin-top:12px}
  .dayhead{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
  .daynum{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--brass);line-height:1}
  .leg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;background:var(--navy);
    border:1px solid var(--line);border-radius:3px;padding:10px}
  .leg div .lbl{font-size:9px}
  .leg div p{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-top:3px}
  .imgstrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .imgstrip img{width:84px;height:64px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
  .imgstrip .rm{position:relative}
  .imgstrip .rm button{position:absolute;top:2px;right:2px;background:rgba(11,28,43,.9);border-radius:2px;padding:2px;color:var(--muted)}

  .fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:70;width:54px;height:54px;
    border-radius:50%;background:var(--brass);color:var(--navy);display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.45)}
  @media(min-width:861px){.fab{bottom:24px}}
  .sheet{position:fixed;inset:0;z-index:80;background:rgba(6,15,24,.75);display:none}
  .sheet.on{display:flex;align-items:flex-end;justify-content:center}
  .sheetbox{background:var(--navy-deep);border:1px solid var(--line);border-radius:8px 8px 0 0;width:100%;
    max-width:660px;height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  @media(min-width:861px){.sheet.on{align-items:center}.sheetbox{border-radius:6px;height:82vh}}
  .sheethead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:13px}
  .msg{max-width:92%;font-size:14px;line-height:1.62;padding:10px 12px;border-radius:4px;white-space:pre-wrap;word-break:break-word}
  .msg.me{align-self:flex-end;background:var(--navy-card);border:1px solid var(--line)}
  .msg.cap{align-self:flex-start;border-left:2px solid var(--brass);border-radius:0;padding-left:12px}
  .msg.err{align-self:flex-start;color:var(--rust);font-size:12px;font-family:'JetBrains Mono',monospace}
  .msgacts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
  .msgacts button{font-size:10.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;
    padding:4px 8px;border:1px solid var(--line);border-radius:3px;color:var(--dim)}
  .msgacts button:active{border-color:var(--brass);color:var(--brass)}
  .ctxbar{padding:8px 16px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    max-height:96px;overflow-y:auto}
  .ctxbar .chip{cursor:pointer;font-size:10.5px}
  .composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;background:var(--navy);border:1px solid var(--line-soft);border-radius:3px;padding:9px 11px;
    color:var(--chart);font-size:14px;outline:none;resize:none;max-height:110px}
  .attachbtn{padding:9px;border:1px solid var(--line-soft);border-radius:3px;color:var(--muted)}
  .pending{display:flex;gap:6px;padding:0 16px 8px;flex-wrap:wrap}
  .pending span{font-size:10.5px;font-family:'JetBrains Mono',monospace;background:var(--navy-card);
    border:1px solid var(--line);border-radius:3px;padding:3px 7px;color:var(--muted)}

  /* ---------- BROŞÜR / YAZDIRMA ---------- */
  #printroot{display:none}
  @media print{
    @page{size:A4;margin:11mm}
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important}
    body{background:#0B1C2B !important}
    .shell,.tabbar,.fab,.sheet{display:none !important}
    #printroot{display:block !important}
    .p-day{break-inside:avoid;page-break-inside:avoid;break-after:page;page-break-after:always}
    .p-day:last-child{break-after:auto;page-break-after:auto}
    .p-cover{break-after:page;page-break-after:always}
    img{max-width:100%}
  }
  #printroot .p-cover{background:#0B1C2B;color:#EDE6D6;padding:52px 40px;min-height:250mm;
    display:flex;flex-direction:column;justify-content:center}
  #printroot .p-cover .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.28em;color:#C89B5C}
  #printroot .p-cover h1{font-family:'Fraunces',serif;font-size:42px;font-weight:600;margin-top:14px;line-height:1.15}
  #printroot .p-cover .sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:#8FA3B0;margin-top:16px;letter-spacing:.08em}
  #printroot .p-cover .intro{font-size:14px;line-height:1.75;color:#8FA3B0;margin-top:26px;max-width:135mm}
  #printroot .p-day{background:#0B1C2B;color:#EDE6D6;padding:26px 30px 34px}
  #printroot .p-day .dh{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid #1E3A52;padding-bottom:12px}
  #printroot .p-day .dn{font-family:'Fraunces',serif;font-size:30px;color:#C89B5C;font-weight:600}
  #printroot .p-day .dt{font-family:'Fraunces',serif;font-size:26px;font-weight:600}
  #printroot .p-day .dd{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:#8FA3B0;margin-top:4px;text-align:right}
  #printroot .p-day .narr{font-size:13px;line-height:1.8;color:#C9D4DC;margin-top:16px;white-space:pre-wrap}
  #printroot .p-leg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#132C40;
    border:1px solid #1E3A52;padding:12px 14px;margin-top:18px}
  #printroot .p-leg .k{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.14em;color:#5C7085;text-transform:uppercase}
  #printroot .p-leg .v{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-top:4px}
  #printroot .p-imgs{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  #printroot .p-imgs img{width:calc(50% - 5px);height:52mm;object-fit:cover;border:1px solid #1E3A52}
  #printroot .p-map{margin-top:16px}
  #printroot .p-map img{width:100%;border:1px solid #1E3A52}
</style>
</head>
<body>

<div class="lockscreen" id="lockScreen">
  <div class="lockbox">
    <div class="lockicon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C89B5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
    </div>
    <div class="lbl" id="lockEyebrow" style="text-align:center">ERİŞİM KODU</div>
    <h2 class="display" id="lockTitle" style="text-align:center;margin-top:6px;font-size:20px">Bu uygulama davetliye özeldir</h2>
    <p class="hint" id="lockBody" style="text-align:center;margin-top:8px">Kaptan'dan aldığınız erişim kodunu girin.</p>
    <input class="f" id="lockInput" type="text" autocomplete="off" autocapitalize="off" style="margin-top:18px;text-align:center;letter-spacing:.15em" placeholder="Erişim kodu">
    <button class="btn" id="lockBtn" style="width:100%;justify-content:center;margin-top:10px">Giriş</button>
    <p id="lockErr" style="color:var(--rust);font-size:12px;text-align:center;margin-top:10px;display:none">Kod yanlış, tekrar deneyin.</p>
  </div>
</div>

<div class="shell">
  <aside>
    <div class="brand">
      <div class="eyebrow">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C89B5C" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>
        KAPTAN KÖŞESİ
      </div>
      <h1 class="display">Yat Yönetim</h1>
    </div>
    <nav class="side" id="sidenav"></nav>
    <div class="sidefoot mono">VERİ CİHAZINIZDA SAKLANIR</div>
  </aside>
  <main>
    <header class="top">
      <div>
        <div class="brg mono" id="topbrg">000°</div>
        <h2 id="toptitle">Genel Bakış</h2>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <select class="langsel" id="langSel"></select>
        <label class="btn ghost sm" for="importFile" id="importLbl">İçe Aktar</label>
        <input type="file" id="importFile" accept="application/json" style="position:absolute;width:1px;height:1px;opacity:0">
        <button class="btn ghost sm" id="exportBtn">Yedek Al</button>
      </div>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>

<nav class="tabbar" id="tabbar"></nav>

<button class="fab" id="fab" title="2. Kaptan">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>
</button>

<div class="sheet" id="sheet">
  <div class="sheetbox">
    <div class="sheethead">
      <div>
        <div class="lbl">DANIŞMA HATTI</div>
        <div class="display" style="font-size:18px;font-weight:600;margin-top:2px">2. Kaptan</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn ghost sm" id="clearChat">Temizle</button>
        <button class="del" id="closeSheet"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="pending" id="pending"></div>
    <div class="ctxbar" id="ctxbar"></div>
    <div class="composer">
      <label class="attachbtn" for="chatFile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.4 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg>
      </label>
      <input type="file" id="chatFile" multiple accept="image/*,application/pdf" style="position:absolute;width:1px;height:1px;opacity:0">
      <textarea id="chatIn" rows="1" placeholder="Sorunuzu yazın…"></textarea>
      <button class="btn" id="sendBtn">Gönder</button>
    </div>
  </div>
</div>

<div id="printroot"></div>

<script>
/* ================================================================
   ERİŞİM KODU — Test grubunla paylaşmadan önce bunu değiştir.
   Kodu bilmeyen biri linke tıklasa bile içeriği göremez.
   Farklı test turları için istediğin zaman değiştirip yeniden
   yayınlayabilirsin (eski kodu bilenler tekrar girmek zorunda kalır).
   ================================================================ */
const ACCESS_CODE = 'MEIRA2026';

/* ================= i18n ================= */
const LANGS=['tr','en','ru','es','it'];
const LANG_NAMES={tr:'Türkçe',en:'English',ru:'Русский',es:'Español',it:'Italiano'};
const RESPOND_LANG={tr:'Turkish',en:'English',ru:'Russian',es:'Spanish',it:'Italian'};
let LANG=localStorage.getItem('yy_lang')||'tr';
if(!LANGS.includes(LANG))LANG='tr';

const T={
tr:{
  appName:'Yat Yönetim', appEyebrow:'KAPTAN KÖŞESİ', sidefoot:'VERİ CİHAZINIZDA SAKLANIR',
  logbookSuffix:'SEYİR DEFTERİ', importBtn:'İçe Aktar', exportBtn:'Yedek Al',
  secOverview:'Genel Bakış', secOverviewShort:'Bakış',
  secYachts:'Tekne Profilleri', secYachtsShort:'Tekne',
  secRoutes:'Rota Kütüphanesi', secRoutesShort:'Rota',
  secItins:'İtinerary / Broşür', secItinsShort:'Broşür',
  secLibrary:'Denizcilik Kütüphanesi', secLibraryShort:'Kütüphane',
  secFiles:'Fotoğraf & Dosya', secFilesShort:'Arşiv',
  statYachts:'TEKNE', unitProfile:'profil', statRoutes:'ROTA', unitRegistered:'kayıtlı',
  statItins:'BROŞÜR', unitDoc:'doküman', statLibrary:'KÜTÜPHANE', unitSource:'kaynak',

function t(key){ return (T[LANG]&&T[LANG][key]!==undefined)?T[LANG][key]:(T.tr[key]!==undefined?T.tr[key]:key); }
function applyStaticLangText(){
  document.documentElement.lang=LANG;

    brandEyebrow.innerHTML='';if(svgEl)brandEyebrow.appendChild(svgEl);
    brandEyebrow.appendChild(document.createTextNode(' '+t('appEyebrow')));
  }
  const brandH1=document.querySelector('.brand h1');if(brandH1)brandH1.textContent=t('appName');
  const sf=document.querySelector('.sidefoot');if(sf)sf.textContent=t('sidefoot');
  const il=document.getElementById('importLbl');if(il)il.textContent=t('importBtn');
  const eb=document.getElementById('exportBtn');if(eb)eb.textContent=t('exportBtn');
  const ls=document.getElementById('langSel');
  if(ls){
    ls.innerHTML=LANGS.map(l=>`<option value="${l}" ${l===LANG?'selected':''}>${LANG_NAMES[l]}</option>`).join('');
    ls.onchange=()=>{LANG=ls.value;localStorage.setItem('yy_lang',LANG);applyStaticLangText();render();
      if(sheet.classList.contains('on')){drawMsgs();drawCtx();drawPending();}};
  }
  const le=document.getElementById('lockEyebrow');if(le)le.textContent=t('lockEyebrow');
  const lt=document.getElementById('lockTitle');if(lt)lt.textContent=t('lockTitle');
  const lb=document.getElementById('lockBody');if(lb)lb.textContent=t('lockBody');
  const li=document.getElementById('lockInput');if(li)li.placeholder=t('lockPlaceholder');
  const lbtn=document.getElementById('lockBtn');if(lbtn)lbtn.textContent=t('lockButton');
  const lerr=document.getElementById('lockErr');if(lerr)lerr.textContent=t('lockError');
}

const DB={h:null};
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('yat-yonetim',2);
  r.onupgradeneeded=e=>{const db=e.target.result;
    if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');
    if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'});};
  r.onsuccess=e=>{DB.h=e.target.result;res()};r.onerror=()=>rej(r.error);})}
const st=(s,m)=>DB.h.transaction(s,m).objectStore(s);
const idbGet=(s,k)=>new Promise(r=>{const q=st(s,'readonly').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)});
const idbPut=(s,v,k)=>new Promise(r=>{const q=k!==undefined?st(s,'readwrite').put(v,k):st(s,'readwrite').put(v);q.onsuccess=()=>r(1);q.onerror=()=>r(0)});
const idbDel=(s,k)=>new Promise(r=>{const q=st(s,'readwrite').delete(k);q.onsuccess=()=>r(1);q.onerror=()=>r(0)});
const idbAll=s=>new Promise(r=>{const q=st(s,'readonly').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])});

let D={yachts:[],routes:[],itins:[],libFolders:[]};
let FILES=[];                 // kind: 'archive' | 'library'
const arch=()=>FILES.filter(f=>f.kind!=='library');
const lib=()=>FILES.filter(f=>f.kind==='library');
const fileById=id=>FILES.find(f=>f.id===id);
const saveData=()=>idbPut('kv',D,'data');

async function loadFiles(){
  FILES.forEach(f=>f.url&&URL.revokeObjectURL(f.url));
  const recs=await idbAll('files');
  FILES=recs.map(r=>({...r,url:r.blob?URL.createObjectURL(r.blob):null}));
  FILES.sort((a,b)=>(b.added||0)-(a.added||0));
}
async function addFiles(list,kind,folder){
  for(const f of list){
    await idbPut('files',{id:uid(),name:f.name||('dosya-'+uid()),type:f.type||'application/octet-stream',
      blob:f,kind,added:Date.now(),note:'',folder:folder||null});
  }
  await loadFiles();
}
async function moveFileFolder(id,folder){
  const rec=await idbGet('files',id);if(!rec)return;
  rec.folder=folder||null;await idbPut('files',rec);await loadFiles();
}
const blobToB64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(b)});

      <div style="display:flex;gap:4px">

function dayCard(it,d,i){

    <div class="dayhead">
      <div style="display:flex;align-items:baseline;gap:10px">

        <div class="meta">${esc(d.date||'')}</div></div>
      </div>
      <div style="display:flex;gap:4px">

    <div class="leg">
      <div><div class="lbl">${t('departLbl')}</div><p>${esc(d.depart||'—')}<span style="font-size:10px;color:var(--dim);margin-left:4px">${esc(d.from||'')}</span></p></div>
      <div><div class="lbl">${t('arriveLbl')}</div><p>${esc(d.arrive||'—')}<span style="font-size:10px;color:var(--dim);margin-left:4px">${esc(d.to||'')}</span></p></div>
      <div><div class="lbl">${t('distanceLbl')}</div><p>${esc(d.distance||'—')} nm</p></div>
      <div><div class="lbl">${t('durationLbl')}</div><p>${etaText(it,d)}</p></div>
    </div>
    <div class="imgstrip">${imgs}
      <label class="btn ghost sm" for="dayimg_${d.id}" style="height:64px;display:flex;align-items:center">${svg(I.plus,13)} ${t('addImage')}</label>
      <input type="file" id="dayimg_${d.id}" data-dayimg="${d.id}" multiple accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0">

}
function etaHours(it,d){
  const y=D.yachts.find(v=>v.id===it.yachtId);
  const sp=parseFloat(d.speed||y?.speed||0), di=parseFloat(d.distance||0);
  if(!sp||!di)return null; return di/sp;
}
function etaText(it,d){
  const h=etaHours(it,d); if(h===null)return '—';
  const H=Math.floor(h), M=Math.round((h-H)*60);
  return `~${H}${t('hourAbbr')} ${String(M).padStart(2,'0')}${t('minAbbr')}`;
}

      <span class="itemname" style="font-size:15.5px">${esc(g.name)} <span class="meta" style="display:inline">· ${g.files.length} ${t('pageWordLower')}</span></span>
      <button class="del" data-delfolder="${esc(g.name)}">${svg(I.trash,14)}</button>
    </div>
    ${g.files.length?`<div class="filegrid">${g.files.map(fileCard).join('')}</div>`:`<div class="empty" style="padding:18px">${t('libFolderEmpty')}</div>`}

    <div class="row" style="margin:22px 0 10px"><span class="itemname" style="font-size:15.5px">${t('libFolderless')}</span></div>
    <div class="filegrid">${loose.map(fileCard).join('')}</div>` : '';
  const body = items.length ? (sections+looseSection) : `<div class="empty">${t('libEmpty')}<br><br><span style="color:var(--muted);letter-spacing:0;font-family:Inter">${t('libEmptySub')}</span></div>`;

        <label class="btn" for="libPhoto">${svg(I.plus,13)} ${t('libPhotoBtn')}</label>

function fHead(){return `<div class="row" style="margin-bottom:12px"><span class="lbl" style="color:var(--brass)">${t('newOrEdit')}</span>

/* ---------- render ---------- */
let editDay=null;
function render(){
  drawNav();
  const v=document.getElementById('view');
  let html = cur==='overview'?vOverview():cur==='yachts'?vYachts():cur==='routes'?vRoutes()
    :cur==='itins'?vItins():cur==='library'?vLibrary():vFiles();
  v.innerHTML=html;
  if(editDay&&openItin){
    const it=D.itins.find(i=>i.id===openItin);
    const d=(it.days||[]).find(x=>x.id===editDay);
    if(d){const el=v.querySelector(`[data-day="${d.id}"]`); if(el)el.insertAdjacentHTML('afterend',fDay(it,d));}
  }
  wire();
}

function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{cur=b.dataset.go;editing=null;openItin=null;editDay=null;render()});
  document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{editing={t:b.dataset.new,v:{id:uid()}};render()});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.edit,arr=t==='yacht'?D.yachts:t==='route'?D.routes:D.itins;
    editing={t,v:{...arr.find(x=>x.id===b.dataset.id)}};render()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm(t('confirmDeleteRecord')))return;const tt=b.dataset.del,id=b.dataset.id;
    if(tt==='yacht')D.yachts=D.yachts.filter(x=>x.id!==id);
    if(tt==='route')D.routes=D.routes.filter(x=>x.id!==id);
    if(tt==='itin')D.itins=D.itins.filter(x=>x.id!==id);
    await saveData();render()});
  const cb=document.getElementById('cancelBtn');if(cb)cb.onclick=()=>{editing=null;editDay=null;render()};
  const sb=document.getElementById('saveBtn');if(sb)sb.onclick=saveForm;
  const ph=document.getElementById('f_photo');
  if(ph)ph.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{editing.v.photo=r.result;render()};r.readAsDataURL(f)};

  // itinerary
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{openItin=b.dataset.open;editing=null;render()});
  const bi=document.getElementById('backItin');if(bi)bi.onclick=()=>{openItin=null;editDay=null;render()};
  const ad=document.getElementById('addDay');
  if(ad)ad.onclick=async()=>{const it=D.itins.find(i=>i.id===openItin);
    it.days=it.days||[];const d={id:uid()};it.days.push(d);await saveData();editDay=d.id;render()};
  document.querySelectorAll('[data-editday]').forEach(b=>b.onclick=()=>{editDay=(editDay===b.dataset.editday?null:b.dataset.editday);render()});
  document.querySelectorAll('[data-delday]').forEach(b=>b.onclick=async()=>{
    if(!confirm(t('confirmDeleteDay')))return;const it=D.itins.find(i=>i.id===openItin);
    it.days=(it.days||[]).filter(x=>x.id!==b.dataset.delday);await saveData();editDay=null;render()});
  const sd=document.getElementById('saveDayBtn');
  if(sd)sd.onclick=async()=>{
    const g=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
    const it=D.itins.find(i=>i.id===openItin), d=(it.days||[]).find(x=>x.id===editDay);
    Object.assign(d,{title:g('d_title'),date:g('d_date'),narrative:g('d_narrative'),from:g('d_from'),
      to:g('d_to'),depart:g('d_depart'),arrive:g('d_arrive'),distance:g('d_distance'),speed:g('d_speed')});
    await saveData();editDay=null;render()};
  document.querySelectorAll('[data-dayimg]').forEach(inp=>inp.onchange=async e=>{
    const fs=[...e.target.files];if(!fs.length)return;
    await addFiles(fs,'archive');
    const newIds=FILES.slice(0,fs.length).map(f=>f.id);
    const it=D.itins.find(i=>i.id===openItin), d=(it.days||[]).find(x=>x.id===inp.dataset.dayimg);
    d.photoIds=[...(d.photoIds||[]),...newIds];await saveData();render()});
  document.querySelectorAll('[data-rmimg]').forEach(b=>b.onclick=async()=>{
    const it=D.itins.find(i=>i.id===openItin), d=(it.days||[]).find(x=>x.id===b.dataset.rmimg);
    d.photoIds=(d.photoIds||[]).filter(x=>x!==b.dataset.fid);await saveData();render()});
  const pb=document.getElementById('printBtn');if(pb)pb.onclick=()=>doPrint(D.itins.find(i=>i.id===openItin));
  document.querySelectorAll('[data-adddayai]').forEach(b=>b.onclick=()=>{
    const it=D.itins.find(i=>i.id===openItin);
    const route=D.routes.find(r=>r.id===it?.routeId);
    const stopsTxt=route?.stops?` ${t('aiDayStopsFragment')}${route.stops}.`:'';
    openChat(`"${it?.title}" ${t('aiDayPrefillPre')}${stopsTxt} ${t('aiDayPrefillPost')}`)});

  // dosyalar
  const nfb=document.getElementById('newFolderBtn');
  if(nfb)nfb.onclick=async()=>{
    const name=prompt(t('promptNewFolder'));
    if(!name||!name.trim())return;
    const clean=name.trim();
    if(!D.libFolders.includes(clean)){D.libFolders.push(clean);await saveData();}
    render();
  };
  [['upPhoto','archive',null],['upDoc','archive',null]].forEach(([id,kind])=>{
    const el=document.getElementById(id);if(!el)return;
    el.onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;await addFiles(fs,kind);render()}});
  [['libPhoto','library'],['libDoc','library']].forEach(([id,kind])=>{
    const el=document.getElementById(id);if(!el)return;
    el.onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;
      const sel=document.getElementById('libFolderTarget');
      await addFiles(fs,kind,sel?sel.value:'');render()}});
  document.querySelectorAll('[data-delfolder]').forEach(b=>b.onclick=async()=>{
    const name=b.dataset.delfolder;
    if(!confirm(`"${name}" ${t('confirmDeleteFolder')}`))return;
    D.libFolders=D.libFolders.filter(n=>n!==name);await saveData();
    for(const f of lib().filter(f=>f.folder===name)) await moveFileFolder(f.id,null);
    render()});
  document.querySelectorAll('[data-movefile]').forEach(sel=>sel.onchange=async()=>{
    await moveFileFolder(sel.dataset.movefile,sel.value);render()});
  document.querySelectorAll('[data-delfile]').forEach(b=>b.onclick=async()=>{
    if(!confirm(t('confirmDeleteFile')))return;await idbDel('files',b.dataset.delfile);await loadFiles();render()});
  document.querySelectorAll('[data-note]').forEach(inp=>inp.onchange=async()=>{
    const rec=await idbGet('files',inp.dataset.note);if(!rec)return;
    rec.note=inp.value;await idbPut('files',rec);await loadFiles()});
}

async function saveForm(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
  const t_=editing.t,v=editing.v;
  if(t_==='yacht'){Object.assign(v,{name:g('f_name'),type:g('f_type'),guests:g('f_guests'),speed:g('f_speed'),loa:g('f_loa'),port:g('f_port')});
    if(!v.name)return alert(t('alertYachtNameRequired'));D.yachts=upsert(D.yachts,v);}
  else if(t_==='route'){Object.assign(v,{name:g('f_name'),region:g('f_region'),days:g('f_days'),stops:g('f_stops')});
    if(!v.name)return alert(t('alertRouteNameRequired'));D.routes=upsert(D.routes,v);}
  else{Object.assign(v,{title:g('f_title'),yachtId:g('f_yachtId'),routeId:g('f_routeId'),dates:g('f_dates'),intro:g('f_intro')});
    if(!v.title)return alert(t('alertTitleRequired'));v.days=v.days||[];D.itins=upsert(D.itins,v);}
  await saveData();editing=null;render();
}
const upsert=(a,v)=>a.some(x=>x.id===v.id)?a.map(x=>x.id===v.id?v:x):[...a,v];

/* ---------- yazdırma ---------- */
function doPrint(it){
  if(!it)return;
  const y=D.yachts.find(v=>v.id===it.yachtId);
  const days=(it.days||[]).map((d,i)=>{
    const imgs=(d.photoIds||[]).map(id=>{const f=fileById(id);return f&&f.url?`<img src="${f.url}">`:''}).join('');
    return `<section class="p-day">
      <div class="dh">
        <div><span class="dn">${String(i+1).padStart(2,'0')}</span></div>
        <div><div class="dt">${esc(d.title||'')}</div><div class="dd">${t('printDayWord')} ${i+1} · ${esc(d.date||'')}</div></div>
      </div>
      ${d.narrative?`<div class="narr">${esc(d.narrative)}</div>`:''}
      <div class="p-leg">
        <div><div class="k">${t('printDepart')}</div><div class="v">${esc(d.depart||'—')}</div><div class="k" style="margin-top:2px">${esc(d.from||'')}</div></div>
        <div><div class="k">${t('printArrive')}</div><div class="v">${esc(d.arrive||'—')}</div><div class="k" style="margin-top:2px">${esc(d.to||'')}</div></div>
        <div><div class="k">${t('printDistance')}</div><div class="v">${esc(d.distance||'—')} nm</div></div>
        <div><div class="k">${t('printDuration')}</div><div class="v">${etaText(it,d)}</div></div>
      </div>
      ${imgs?`<div class="p-imgs">${imgs}</div>`:''}
    </section>`}).join('');
  document.getElementById('printroot').innerHTML=`
    <section class="p-cover">
      <div class="eyebrow">${t('printCoverEyebrow')}</div>
      <h1>${esc(it.title)}</h1>
      <div class="sub">${esc(y?y.name:'')} ${y?.type?'· '+esc(y.type):''} ${it.dates?'· '+esc(it.dates):''}</div>
      ${it.intro?`<div class="intro">${esc(it.intro)}</div>`:''}
    </section>${days}`;
  setTimeout(()=>window.print(),120);
}

/* ---------- yedek ---------- */
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='yat-yonetim-yedek-'+new Date().toISOString().slice(0,10)+'.json';a.click();
};
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const incoming=JSON.parse(r.result);
      if(!incoming||typeof incoming!=='object')throw new Error(t('errInvalidFile'));
      const mode=confirm(t('confirmImportMode'));
      if(mode){
        D={yachts:incoming.yachts||[],routes:incoming.routes||[],itins:(incoming.itins||[]).map(i=>({...i,days:i.days||[]})),libFolders:incoming.libFolders||[]};
      }else{
        const mergeArr=(a,b)=>{const ids=new Set(a.map(x=>x.id));return [...a,...b.filter(x=>!ids.has(x.id))]};
        const mergeStrArr=(a,b)=>[...new Set([...a,...(b||[])])];
        D={
          yachts:mergeArr(D.yachts,incoming.yachts||[]),
          routes:mergeArr(D.routes,incoming.routes||[]),
          itins:mergeArr(D.itins,(incoming.itins||[]).map(i=>({...i,days:i.days||[]}))),
          libFolders:mergeStrArr(D.libFolders,incoming.libFolders||[])
        };
      }
      await saveData();render();
      alert(t('alertImportDone'));
    }catch(err){alert(t('alertImportError')+err.message)}
  };
  r.readAsText(f);e.target.value='';
};

/* ================= 2. KAPTAN ================= */
const sheet=document.getElementById('sheet');
let CHAT=[], PENDING=[], LIBSEL=[];
function openChat(prefill){
  sheet.classList.add('on');drawMsgs();drawCtx();
  const i=document.getElementById('chatIn');if(prefill)i.value=prefill;i.focus();
}
document.getElementById('fab').onclick=()=>openChat();
document.getElementById('closeSheet').onclick=()=>sheet.classList.remove('on');
document.getElementById('clearChat').onclick=()=>{CHAT=[];PENDING=[];drawMsgs();drawPending()};
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('on')};

document.getElementById('chatFile').onchange=async e=>{
  for(const f of e.target.files){
    PENDING.push({name:f.name,type:f.type,b64:await blobToB64(f)});
  }
  drawPending();e.target.value='';
};
function drawPending(){
  document.getElementById('pending').innerHTML=PENDING.map((p,i)=>
    `<span>${esc(p.name)} <button data-rmp="${i}" style="color:var(--rust);margin-left:4px">×</button></span>`).join('');
  document.querySelectorAll('[data-rmp]').forEach(b=>b.onclick=()=>{PENDING.splice(+b.dataset.rmp,1);drawPending()});
}
function drawCtx(){
  const items=lib();
  const bar=document.getElementById('ctxbar');
  if(!items.length){bar.innerHTML=`<span class="hint">${t('chatLibEmpty')}</span>`;return}
  const hint=`<span class="hint" style="width:100%;margin-bottom:2px">${t('chatHint')}</span>`;
  const grouped=D.libFolders.map(name=>({name,files:items.filter(f=>f.folder===name)})).filter(g=>g.files.length);
  const loose=items.filter(f=>!f.folder||!D.libFolders.includes(f.folder));
  let html=hint;
  grouped.forEach(g=>{
    html+=`<span class="lbl" style="width:100%;margin-top:4px">${esc(g.name)}</span>`+g.files.map(f=>
      `<span class="chip ${LIBSEL.includes(f.id)?'on':''}" data-lib="${f.id}">${esc(f.name.slice(0,22))}</span>`).join('');
  });
  if(loose.length){
    html+=`<span class="lbl" style="width:100%;margin-top:4px">${t('libFolderless')}</span>`+loose.map(f=>
      `<span class="chip ${LIBSEL.includes(f.id)?'on':''}" data-lib="${f.id}">${esc(f.name.slice(0,26))}</span>`).join('');
  }
  bar.innerHTML=html;
  document.querySelectorAll('[data-lib]').forEach(c=>c.onclick=()=>{
    const id=c.dataset.lib;LIBSEL=LIBSEL.includes(id)?LIBSEL.filter(x=>x!==id):[...LIBSEL,id];drawCtx()});
}

function drawMsgs(){
  const box=document.getElementById('msgs');
  if(!localStorage.getItem('anthropic_key')){
    box.innerHTML=`<div class="hint">
      <p style="margin-bottom:11px;color:var(--chart)"><strong>${t('chatKeyNeededTitle')}</strong></p>
      <p style="margin-bottom:11px">${t('chatKeyNeededBody')}</p>
      <input class="f" id="keyIn" type="password" placeholder="sk-ant-…" style="margin-bottom:9px">
      <button class="btn" id="keySave">${t('chatKeySave')}</button></div>`;
    document.getElementById('keySave').onclick=()=>{const k=document.getElementById('keyIn').value.trim();
      if(!k)return;localStorage.setItem('anthropic_key',k);drawMsgs()};
    return;
  }
  box.innerHTML=CHAT.length?CHAT.map((m,i)=>{
    const cls=m.role==='user'?'me':m.role==='error'?'err':'cap';
    const acts=m.role==='assistant'&&m.text!=='…'?`<div class="msgacts">
      <button data-copy="${i}">${t('chatCopy')}</button><button data-share="${i}">${t('chatShare')}</button>
      <button data-dl="${i}">${t('chatDownload')}</button><button data-save="${i}">${t('chatSaveArchive')}</button></div>`:'';
    return `<div class="msg ${cls}">${esc(m.text)}${acts}</div>`}).join('')
    :`<div class="hint">${t('chatEmptyIntro')}</div>`;
  box.scrollTop=box.scrollHeight;
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{
    navigator.clipboard.writeText(CHAT[+b.dataset.copy].text);b.textContent=t('chatCopied')});
  document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{
    const tx=CHAT[+b.dataset.share].text;
    if(navigator.share)navigator.share({text:tx}).catch(()=>{});else{navigator.clipboard.writeText(tx);b.textContent=t('chatCopied')}});
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{
    const blob=new Blob([CHAT[+b.dataset.dl].text],{type:'text/markdown'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='2-kaptan-'+Date.now()+'.md';a.click()});
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{
    const tx=CHAT[+b.dataset.save].text;
    const blob=new Blob([tx],{type:'text/markdown'});
    await idbPut('files',{id:uid(),name:t('captainNotePrefix')+new Date().toLocaleDateString(),
      type:'text/markdown',blob,kind:'archive',added:Date.now(),note:''});
    await loadFiles();b.textContent=t('chatSaved');if(cur==='files')render()});
}

function ctxText(){
  const clean=o=>JSON.parse(JSON.stringify(o,(k,v)=>k==='photo'?undefined:v));
  const folderSummary=D.libFolders.map(name=>`${name} (${lib().filter(f=>f.folder===name).length} pages)`).join(' | ')||'none';
  const looseSummary=lib().filter(f=>!f.folder||!D.libFolders.includes(f.folder)).map(f=>f.name).join(', ')||'none';
  return `The user is an experienced yacht captain. Current records in the app:

YACHTS: ${JSON.stringify(clean(D.yachts))}
ROUTES: ${JSON.stringify(D.routes)}
BROCHURES/ITINERARIES: ${JSON.stringify(clean(D.itins))}
LIBRARY FOLDERS (each folder is one book/source): ${folderSummary}
UNFOLDERED LIBRARY FILES: ${looseSummary}
ARCHIVE FILES: ${arch().map(f=>f.name).join(', ')||'none'}`;
}

// Mesaj metnindeki durak/bölge isimleriyle klasör (kitap) adlarını eşleştirip,
// eşleşen klasörlerin TÜM dosyalarını otomatik seçer — sormadan tarama için.
function autoMatchLibraryIds(text){
  const norm=s=>(s||'').toLocaleLowerCase('tr').replace(/[^a-zçğıöşü0-9]+/g,' ').trim();
  const t=' '+norm(text)+' ';
  const matchedFolders=D.libFolders.filter(name=>{
    const words=norm(name).split(' ').filter(w=>w.length>=4);
    return words.some(w=>t.includes(' '+w));
  });
  if(!matchedFolders.length)return [];
  return lib().filter(f=>matchedFolders.includes(f.folder)).map(f=>f.id);
}

async function send(){
  const inp=document.getElementById('chatIn');
  const text=inp.value.trim();
  if(!text&&!PENDING.length&&!LIBSEL.length)return;
  inp.value='';

  // Kullanıcı elle bir kaynak seçmediyse: önce mesajdaki durak/bölge isimleriyle eşleşen
  // klasörleri (kitapları) hiç sormadan tara; eşleşme yoksa ve "kütüphane"/"library" geçiyorsa hepsini ekle.
  let autoAttached = 0;
  if(!LIBSEL.length){
    const matched = autoMatchLibraryIds(text);
    if(matched.length){
      LIBSEL = matched.slice(0,10);
      autoAttached = LIBSEL.length;
    } else if(/k[üu]t[üu]phane|library|библиотек|biblioteca/i.test(text)){
      LIBSEL = lib().slice(0,8).map(f=>f.id);
      autoAttached = LIBSEL.length;
    }
  }

  const parts=[];
  for(const id of LIBSEL){
    const f=fileById(id);if(!f||!f.blob)continue;
    const b64=await blobToB64(f.blob);
    if(f.type.startsWith('image/'))parts.push({type:'image',source:{type:'base64',media_type:f.type,data:b64}});
    else if(f.type==='application/pdf')parts.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}});
  }
  for(const p of PENDING){
    if(p.type.startsWith('image/'))parts.push({type:'image',source:{type:'base64',media_type:p.type,data:p.b64}});
    else if(p.type==='application/pdf')parts.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:p.b64}});
  }
  parts.push({type:'text',text:text||t('evalAttachedFallback')});

  const label=text+(PENDING.length?`  [${PENDING.length} ${t('attachSuffix')}]`:'')+
    (LIBSEL.length?(autoAttached?`  [${LIBSEL.length} ${t('libSourceAutoSuffix')}]`:`  [${LIBSEL.length} ${t('libSourceSuffix')}]`):'');
  CHAT.push({role:'user',text:label,parts});
  PENDING=[];LIBSEL=[];drawPending();drawCtx();
  CHAT.push({role:'assistant',text:'…'});drawMsgs();

  try{
    const msgs=CHAT.filter(m=>m.role!=='error'&&m.text!=='…')
      .map(m=>({role:m.role,content:m.parts||m.text}));
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':localStorage.getItem('anthropic_key'),
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:3000,
        system:`You are this captain's second-in-command ("2. Kaptan" / 2nd Captain). Respond in ${RESPOND_LANG[LANG]||'Turkish'}, with maritime expertise and a yacht-operations management perspective — clear and practical, no unnecessary padding.
If asked for brochure text, write it warm and fluent, suitable for guests and charter brokers.
If the captain's own library sources are provided to you as attachments, prefer them over general web knowledge — they are field-tested and trustworthy.
Use the web search tool when current information is needed (weather, harbor fees, regulations, seasonal info).

IMPORTANT — how your access to library sources works: the library info below is only folder (book) names, page counts, and any notes — you CANNOT automatically see the actual image/PDF content of these sources. Content only actually reaches you when: (1) stop/region names in the message match a folder name, in which case the app automatically attaches ALL pages in that folder without asking — this is how you can already scan the right books when given specific stops/spots, no permission needed; (2) the user's message contains the word "library" (in their language), which attaches all sources; (3) the user taps the relevant source's chip below the chat box. If you're asked to interpret a source's content but there is no actual image/PDF block attached to the message (i.e. you only see a name/note — the folder name probably didn't match any stop name), tell the user briefly and clearly, in ${RESPOND_LANG[LANG]||'Turkish'}: "match the book's folder name to the stop name, or mention 'library' in your message." NEVER suggest methods that don't exist in this app (external upload, copying elsewhere, etc).

${ctxText()}`,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:msgs
      })
    });
    const data=await res.json();
    CHAT.pop();
    if(data.error)CHAT.push({role:'error',text:t('chatErrorPrefix')+(data.error.message||t('chatErrorUnknown'))});
    else CHAT.push({role:'assistant',text:(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim()||t('chatEmptyResponse')});
  }catch(err){CHAT.pop();CHAT.push({role:'error',text:t('chatConnFail')+err.message})}
  drawMsgs();
}
document.getElementById('sendBtn').onclick=send;
document.getElementById('chatIn').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

/* ---------- erişim kodu ---------- */
function checkAccess(){
  return localStorage.getItem('yy_unlocked_code')===ACCESS_CODE;
}
function wireLock(){
  const scr=document.getElementById('lockScreen');
  const inp=document.getElementById('lockInput');
  const btn=document.getElementById('lockBtn');
  const err=document.getElementById('lockErr');
  const tryUnlock=()=>{
    const entered=(inp.value||'').trim();
    if(entered && entered===ACCESS_CODE){
      localStorage.setItem('yy_unlocked_code',ACCESS_CODE);
      scr.classList.add('hidden');
      startApp();
    }else{
      err.style.display='block';inp.value='';inp.focus();
    }
  };
  btn.onclick=tryUnlock;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryUnlock();}});
}

/* ---------- başlat ---------- */
async function startApp(){
  await openDB();
  const saved=await idbGet('kv','data');
  if(saved)D={yachts:saved.yachts||[],routes:saved.routes||[],itins:(saved.itins||[]).map(i=>({...i,days:i.days||[]})),libFolders:saved.libFolders||[]};
  await loadFiles();
  render();
}
(async()=>{
  if(new URLSearchParams(location.search).has('relock')){
    localStorage.removeItem('yy_unlocked_code');
  }
  applyStaticLangText();
  if(checkAccess()){
    document.getElementById('lockScreen').classList.add('hidden');
    await startApp();
  }else{
    wireLock();
    document.getElementById('lockInput').focus();
  }
})();
