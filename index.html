<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yat Yönetim">
<meta name="theme-color" content="#0B1C2B">
<title>Yat Yönetim — Kaptan Köşesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230B1C2B'/%3E%3Cg stroke='%23C89B5C' stroke-width='9' fill='none' stroke-linecap='round'%3E%3Ccircle cx='90' cy='42' r='13'/%3E%3Cline x1='90' y1='55' x2='90' y2='140'/%3E%3Cline x1='58' y1='78' x2='122' y2='78'/%3E%3Cpath d='M42 108a48 48 0 0 0 96 0'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --navy-deep:#0B1C2B; --navy:#0E2233; --navy-card:#132C40; --line:#1E3A52;
    --line-soft:#2A4258; --brass:#C89B5C; --chart:#EDE6D6; --muted:#8FA3B0;
    --dim:#5C7085; --rust:#C1440E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--navy);color:var(--chart);font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  .display{font-family:'Fraunces',Georgia,serif}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  ::selection{background:var(--brass);color:var(--navy)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}
  a{color:var(--brass)}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh}
  aside{width:250px;flex-shrink:0;background:var(--navy-deep);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:32px 24px 22px;border-bottom:1px solid var(--line)}
  .brand .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:7px}
  .brand h1{font-size:24px;font-weight:600;margin-top:8px;letter-spacing:-.01em}
  nav.side{flex:1;padding:14px 0;overflow-y:auto}
  .navbtn{width:100%;display:flex;align-items:center;gap:12px;padding:13px 24px;text-align:left;
    color:var(--dim);position:relative;transition:background .15s,color .15s}
  .navbtn:hover{color:var(--muted)}
  .navbtn.on{background:var(--navy-card);color:var(--chart)}
  .navbtn.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass)}
  .navbtn .lbl{font-size:14px;font-weight:500;display:block}
  .navbtn .brg{font-size:10px;letter-spacing:.1em;color:var(--dim);display:block;margin-top:2px}
  .navbtn.on .brg{color:var(--brass)}
  .navbtn svg{flex-shrink:0}
  .sidefoot{padding:18px 24px;border-top:1px solid var(--line);font-size:10px;letter-spacing:.1em;color:#4A5D6E}

  main{flex:1;min-width:0}
  header.top{padding:30px 40px 22px;border-bottom:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
  header.top .brg{font-size:11px;letter-spacing:.2em;color:var(--brass)}
  header.top h2{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin-top:5px;letter-spacing:-.01em}
  .wrap{padding:30px 40px 60px;max-width:1060px}

  /* ---------- mobile ---------- */
  .tabbar{display:none}
  @media(max-width:820px){
    aside{display:none}
    header.top{padding:calc(20px + env(safe-area-inset-top)) 20px 16px}
    header.top h2{font-size:24px}
    .wrap{padding:20px 20px 110px}
    .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
      background:var(--navy-deep);border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom)}
    .tabbar button{flex:1;padding:11px 4px 10px;display:flex;flex-direction:column;
      align-items:center;gap:4px;color:var(--dim);font-size:10px;letter-spacing:.02em}
    .tabbar button.on{color:var(--brass)}
    .grid2{grid-template-columns:1fr !important}
    .stats{flex-direction:column}
  }

  /* ---------- pieces ---------- */
  .card{background:var(--navy-card);border:1px solid var(--line);border-radius:3px;padding:20px}
  .stats{display:flex;gap:14px;margin-bottom:22px}
  .stats .card{flex:1}
  .lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
    font-family:'JetBrains Mono',monospace}
  .bignum{font-family:'Fraunces',serif;font-size:38px;font-weight:600;line-height:1;margin-top:8px}
  .bignum span{font-family:'Inter',sans-serif;font-size:12px;font-weight:400;color:var(--dim);margin-left:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:3px;
    background:var(--brass);color:var(--navy);font-size:13px;font-weight:600;transition:opacity .15s}
  .btn:active{opacity:.75}
  .btn.ghost{background:transparent;border:1px solid var(--line-soft);color:var(--muted);font-weight:500}
  .btn.ghost:active{border-color:var(--brass)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .del{color:var(--dim);padding:6px;border-radius:3px}
  .del:active{color:var(--rust)}

  label.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  label.f>span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    font-family:'JetBrains Mono',monospace}
  input.f,textarea.f,select.f{background:var(--navy);border:1px solid var(--line-soft);
    border-radius:3px;padding:10px 12px;font-size:14px;color:var(--chart);outline:none;width:100%}
  input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--brass)}
  textarea.f{resize:vertical;min-height:74px;line-height:1.55}

  .empty{border:1px dashed var(--line-soft);border-radius:3px;padding:44px 20px;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--dim)}
  .chip{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 9px;border-radius:3px;
    background:var(--navy);color:var(--muted);display:inline-block}
  .itemname{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
  .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin-top:4px}
  .stack>*+*{margin-top:14px}
  .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;background:var(--navy);
    border:1px solid var(--line)}
  .filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .filecard{position:relative;background:var(--navy-card);border:1px solid var(--line);
    border-radius:3px;overflow:hidden}
  .filecard .cap{padding:8px 10px;font-size:11px;color:var(--muted);word-break:break-word}
  .filecard .x{position:absolute;top:6px;right:6px;background:rgba(11,28,43,.85);border-radius:3px;
    padding:5px;color:var(--muted)}
  .docicon{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
    background:var(--navy);border-bottom:1px solid var(--line)}

  /* ---------- captain chat ---------- */
  .fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;
    width:54px;height:54px;border-radius:50%;background:var(--brass);color:var(--navy);
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.45)}
  @media(min-width:821px){.fab{bottom:26px}}
  .sheet{position:fixed;inset:0;z-index:80;background:rgba(6,15,24,.72);display:none}
  .sheet.on{display:flex;align-items:flex-end;justify-content:center}
  .sheetbox{background:var(--navy-deep);border:1px solid var(--line);border-radius:8px 8px 0 0;
    width:100%;max-width:620px;height:86vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom)}
  @media(min-width:821px){.sheet.on{align-items:center}.sheetbox{border-radius:6px;height:78vh}}
  .sheethead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between}
  .msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:88%;font-size:14px;line-height:1.6;padding:11px 13px;border-radius:4px;white-space:pre-wrap}
  .msg.me{align-self:flex-end;background:var(--navy-card);border:1px solid var(--line)}
  .msg.cap{align-self:flex-start;background:transparent;border-left:2px solid var(--brass);
    padding-left:12px;border-radius:0}
  .msg.err{align-self:flex-start;color:var(--rust);font-size:12px;font-family:'JetBrains Mono',monospace}
  .composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:9px;align-items:flex-end}
  .composer textarea{flex:1;background:var(--navy);border:1px solid var(--line-soft);border-radius:3px;
    padding:10px 12px;color:var(--chart);font-size:14px;outline:none;resize:none;max-height:120px}
  .hint{font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>

<div class="shell">
  <aside>
    <div class="brand">
      <div class="eyebrow">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C89B5C" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>
        KAPTAN KÖŞESİ
      </div>
      <h1 class="display">Yat Yönetim</h1>
    </div>
    <nav class="side" id="sidenav"></nav>
    <div class="sidefoot mono" id="sidefoot">VERİ CİHAZINIZDA SAKLANIR</div>
  </aside>

  <main>
    <header class="top">
      <div>
        <div class="brg mono" id="topbrg">000° — SEYİR DEFTERİ</div>
        <h2 id="toptitle">Genel Bakış</h2>
      </div>
      <button class="btn ghost sm" id="exportBtn">Yedek Al</button>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>

<nav class="tabbar" id="tabbar"></nav>

<button class="fab" id="fab" title="2. Kaptan">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>
</button>

<div class="sheet" id="sheet">
  <div class="sheetbox">
    <div class="sheethead">
      <div>
        <div class="lbl">DANIŞMA HATTI</div>
        <div class="display" style="font-size:19px;font-weight:600;margin-top:3px">2. Kaptan</div>
      </div>
      <button class="del" id="closeSheet">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <textarea id="chatIn" rows="1" placeholder="Sorunuzu yazın…"></textarea>
      <button class="btn" id="sendBtn">Gönder</button>
    </div>
  </div>
</div>

<script>
/* ============ ikonlar ============ */
const I = {
  compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9 16.2 7.8"/>',
  ship:'<path d="M2 20a2.4 2.4 0 0 0 2-1 2.4 2.4 0 0 1 4 0 2.4 2.4 0 0 0 4 0 2.4 2.4 0 0 1 4 0 2.4 2.4 0 0 0 4 0"/><path d="M4 18l-2-6h20l-2 6"/><path d="M12 12V4"/><path d="M12 4l6 3-6 2"/>',
  map:'<polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  folder:'<path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  trash:'<polyline points="3 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'
};
const svg=(p,s=16,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

/* ============ veri deposu (IndexedDB) ============ */
const DB={h:null};
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('yat-yonetim',1);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if(!db.objectStoreNames.contains('files')) db.createObjectStore('files',{keyPath:'id'});
    };
    r.onsuccess=e=>{DB.h=e.target.result;res()};
    r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode){return DB.h.transaction(store,mode).objectStore(store)}
function idbGet(store,key){return new Promise(r=>{const q=tx(store,'readonly').get(key);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)})}
function idbPut(store,val,key){return new Promise(r=>{const q=key!==undefined?tx(store,'readwrite').put(val,key):tx(store,'readwrite').put(val);q.onsuccess=()=>r(true);q.onerror=()=>r(false)})}
function idbDel(store,key){return new Promise(r=>{const q=tx(store,'readwrite').delete(key);q.onsuccess=()=>r(true);q.onerror=()=>r(false)})}
function idbAll(store){return new Promise(r=>{const q=tx(store,'readonly').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])})}

let D={yachts:[],routes:[],itins:[]};
let FILES=[];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function saveData(){await idbPut('kv',D,'data')}

/* ============ bölümler ============ */
const SECTIONS=[
  {id:'overview',label:'Genel Bakış',short:'Bakış',brg:'000°',icon:I.compass},
  {id:'yachts',label:'Tekne Profilleri',short:'Tekne',brg:'090°',icon:I.ship},
  {id:'routes',label:'Rota Kütüphanesi',short:'Rota',brg:'180°',icon:I.map},
  {id:'itins',label:'İtinerary / Broşür',short:'İtinerary',brg:'270°',icon:I.book},
  {id:'files',label:'Fotoğraf & Dosya',short:'Arşiv',brg:'360°',icon:I.folder}
];
let cur='overview', editing=null;

function drawNav(){
  document.getElementById('sidenav').innerHTML=SECTIONS.map(s=>`
    <button class="navbtn ${s.id===cur?'on':''}" data-go="${s.id}">
      ${svg(s.icon,16,s.id===cur?'#C89B5C':'#5C7085')}
      <span><span class="lbl" style="font-family:Inter;text-transform:none;letter-spacing:0;font-size:14px;color:inherit">${s.label}</span>
      <span class="brg mono">${s.brg}</span></span>
    </button>`).join('');
  document.getElementById('tabbar').innerHTML=SECTIONS.map(s=>`
    <button class="${s.id===cur?'on':''}" data-go="${s.id}">
      ${svg(s.icon,19)}<span>${s.short}</span>
    </button>`).join('');
  const s=SECTIONS.find(x=>x.id===cur);
  document.getElementById('topbrg').textContent=s.brg+' — SEYİR DEFTERİ';
  document.getElementById('toptitle').textContent=s.label;
}

/* ============ görünümler ============ */
function vOverview(){
  const cards=SECTIONS.filter(s=>s.id!=='overview').map(s=>`
    <button class="card" data-go="${s.id}" style="display:flex;align-items:center;gap:10px;text-align:left">
      ${svg(s.icon,15,'#C89B5C')}<span style="font-size:14px">${s.label}</span>
    </button>`).join('');
  const upcoming=D.itins.length?`<div class="card"><div class="lbl">SON KAYITLAR</div>
    <div class="stack" style="margin-top:12px">${D.itins.slice(-3).reverse().map(it=>{
      const y=D.yachts.find(v=>v.id===it.yachtId);
      return `<div><div style="font-size:14px">${esc(it.title)}</div>
      <div class="meta">${esc(y?y.name:'—')} · ${esc(it.dates||'tarih yok')}</div></div>`}).join('')}</div></div>`:'';
  return `<div class="stats">
    <div class="card"><div class="lbl">TEKNE</div><div class="bignum">${D.yachts.length}<span>profil</span></div></div>
    <div class="card"><div class="lbl">ROTA</div><div class="bignum">${D.routes.length}<span>kayıtlı</span></div></div>
    <div class="card"><div class="lbl">İTİNERARY</div><div class="bignum">${D.itins.length}<span>doküman</span></div></div>
    <div class="card"><div class="lbl">ARŞİV</div><div class="bignum">${FILES.length}<span>dosya</span></div></div>
  </div>
  <div class="card" style="margin-bottom:14px"><div class="lbl">HIZLI ERİŞİM</div>
    <div class="grid2" style="margin-top:12px;gap:10px">${cards}</div></div>
  ${upcoming}`;
}

function vYachts(){
  const form=editing?.t==='yacht'?formYacht(editing.v):'';
  const list=D.yachts.length?`<div class="grid2">${D.yachts.map(y=>`
    <div class="card">
      ${y.photo?`<img class="thumb" src="${y.photo}" style="margin-bottom:12px">`:''}
      <div class="row" style="margin-bottom:12px;align-items:flex-start">
        <div><div class="itemname">${esc(y.name)}</div><div class="meta">${esc(y.type||'')}</div></div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn ghost sm" data-edit="yacht" data-id="${y.id}">Düzenle</button>
          <button class="del" data-del="yacht" data-id="${y.id}">${svg(I.trash,15)}</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px" class="mono">
        <div><div class="lbl">MİSAFİR</div><div style="font-size:13px;color:var(--muted);margin-top:3px">${esc(y.guests||'—')}</div></div>
        <div><div class="lbl">HIZ</div><div style="font-size:13px;color:var(--muted);margin-top:3px">${esc(y.speed||'—')} kt</div></div>
        <div><div class="lbl">LİMAN</div><div style="font-size:13px;color:var(--muted);margin-top:3px">${esc(y.port||'—')}</div></div>
      </div>
    </div>`).join('')}</div>`:`<div class="empty">TEKNE PROFİLİ YOK — EKLEMEK İÇİN YUKARIDAKİ BUTONU KULLANIN</div>`;
  return head(D.yachts.length+' profil kayıtlı','yacht','Tekne Ekle')+form+list;
}
function formYacht(v){
  return `<div class="card" style="margin-bottom:16px">
    ${formHead()}
    <div class="grid2"><label class="f"><span>Tekne Adı</span><input class="f" id="f_name" value="${esc(v.name||'')}" placeholder="M/Y MEIRA"></label>
    <label class="f"><span>Tip</span><input class="f" id="f_type" value="${esc(v.type||'')}" placeholder="Motor Sailing Yacht"></label></div>
    <div class="grid2"><label class="f"><span>Misafir Kapasitesi</span><input class="f" id="f_guests" value="${esc(v.guests||'')}" placeholder="12"></label>
    <label class="f"><span>Seyir Hızı (knot)</span><input class="f" id="f_speed" value="${esc(v.speed||'')}" placeholder="11.5"></label></div>
    <div class="grid2"><label class="f"><span>Boy (LOA, m)</span><input class="f" id="f_loa" value="${esc(v.loa||'')}"></label>
    <label class="f"><span>Ana Liman</span><input class="f" id="f_port" value="${esc(v.port||'')}" placeholder="Rhodes"></label></div>
    <label class="f"><span>Tekne Fotoğrafı</span><input type="file" accept="image/*" id="f_photo" class="f"></label>
    ${v.photo?`<img class="thumb" src="${v.photo}" style="max-width:220px;margin-bottom:12px">`:''}
    <button class="btn" id="saveBtn">Kaydet</button></div>`;
}

function vRoutes(){
  const form=editing?.t==='route'?formRoute(editing.v):'';
  const list=D.routes.length?`<div class="stack">${D.routes.map(r=>`
    <div class="card">
      <div class="row" style="align-items:flex-start;margin-bottom:0">
        <div><div class="itemname">${esc(r.name)}</div><div class="meta">${esc(r.region||'—')} · ${esc(r.days||'?')} GÜN</div></div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn ghost sm" data-edit="route" data-id="${r.id}">Düzenle</button>
          <button class="del" data-del="route" data-id="${r.id}">${svg(I.trash,15)}</button>
        </div>
      </div>
      ${r.stops?`<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:13px">${r.stops.split(',').filter(s=>s.trim()).map(s=>`<span class="chip">${esc(s.trim())}</span>`).join('')}</div>`:''}
    </div>`).join('')}</div>`:`<div class="empty">ROTA KÜTÜPHANESİ BOŞ</div>`;
  return head(D.routes.length+' rota kayıtlı','route','Rota Ekle')+form+list;
}
function formRoute(v){
  return `<div class="card" style="margin-bottom:16px">${formHead()}
    <div class="grid2"><label class="f"><span>Rota Adı</span><input class="f" id="f_name" value="${esc(v.name||'')}" placeholder="Dodecanese Summer Cruise"></label>
    <label class="f"><span>Bölge</span><input class="f" id="f_region" value="${esc(v.region||'')}" placeholder="Dodecanese"></label></div>
    <label class="f"><span>Gün Sayısı</span><input class="f" id="f_days" value="${esc(v.days||'')}" placeholder="11"></label>
    <label class="f"><span>Duraklar (virgülle ayırın)</span><textarea class="f" id="f_stops" placeholder="Rhodes, Symi, Tilos, Kos…">${esc(v.stops||'')}</textarea></label>
    <button class="btn" id="saveBtn">Kaydet</button></div>`;
}

function vItins(){
  const form=editing?.t==='itin'?formItin(editing.v):'';
  const list=D.itins.length?`<div class="stack">${D.itins.map(it=>{
    const y=D.yachts.find(v=>v.id===it.yachtId), r=D.routes.find(v=>v.id===it.routeId);
    return `<div class="card">
      <div class="row" style="align-items:flex-start;margin-bottom:0">
        <div><div class="itemname">${esc(it.title)}</div>
        <div class="meta">${esc(y?y.name:'tekne yok')} · ${esc(r?r.name:'rota yok')} · ${esc(it.dates||'tarih yok')}</div></div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn ghost sm" data-edit="itin" data-id="${it.id}">Düzenle</button>
          <button class="del" data-del="itin" data-id="${it.id}">${svg(I.trash,15)}</button>
        </div>
      </div>
      ${it.notes?`<p style="font-size:14px;color:var(--muted);margin-top:12px;line-height:1.6;white-space:pre-wrap">${esc(it.notes)}</p>`:''}
    </div>`}).join('')}</div>`:`<div class="empty">HENÜZ İTİNERARY KAYDEDİLMEDİ</div>`;
  return head(D.itins.length+' doküman kayıtlı','itin','İtinerary Ekle')+form+list;
}
function formItin(v){
  const yo=D.yachts.map(y=>`<option value="${y.id}" ${v.yachtId===y.id?'selected':''}>${esc(y.name)}</option>`).join('');
  const ro=D.routes.map(r=>`<option value="${r.id}" ${v.routeId===r.id?'selected':''}>${esc(r.name)}</option>`).join('');
  return `<div class="card" style="margin-bottom:16px">${formHead()}
    <label class="f"><span>Başlık</span><input class="f" id="f_title" value="${esc(v.title||'')}" placeholder="Dodecanese Summer Cruise 2026"></label>
    <div class="grid2">
      <label class="f"><span>Tekne</span><select class="f" id="f_yachtId"><option value="">Seçin…</option>${yo}</select></label>
      <label class="f"><span>Rota</span><select class="f" id="f_routeId"><option value="">Seçin…</option>${ro}</select></label>
    </div>
    <label class="f"><span>Tarihler</span><input class="f" id="f_dates" value="${esc(v.dates||'')}" placeholder="29 Jul – 08 Aug 2026"></label>
    <label class="f"><span>Notlar</span><textarea class="f" id="f_notes" placeholder="Broşür için notlar, günlük program…">${esc(v.notes||'')}</textarea></label>
    <button class="btn" id="saveBtn">Kaydet</button></div>`;
}

function vFiles(){
  const list=FILES.length?`<div class="filegrid">${FILES.map(f=>`
    <div class="filecard">
      <button class="x" data-delfile="${f.id}">${svg(I.x,13)}</button>
      ${f.type.startsWith('image/')
        ? `<img class="thumb" style="border:none;border-radius:0;border-bottom:1px solid var(--line)" src="${f.url}">`
        : `<div class="docicon">${svg(I.file,28,'#5C7085')}</div>`}
      <div class="cap">${esc(f.name)}</div>
    </div>`).join('')}</div>`:`<div class="empty">ARŞİV BOŞ — FOTOĞRAF VEYA DOSYA YÜKLEYİN</div>`;
  return `<div class="row">
    <span class="mono" style="font-size:12px;color:var(--dim)">${FILES.length} dosya · cihazınızda saklanıyor</span>
    <label class="btn">${svg(I.plus,14)} Dosya Yükle
      <input type="file" id="uploader" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none"></label>
  </div>${list}`;
}

function head(count,type,btn){
  return `<div class="row"><span class="mono" style="font-size:12px;color:var(--dim)">${count}</span>
    <button class="btn" data-new="${type}">${svg(I.plus,14)} ${btn}</button></div>`;
}
function formHead(){
  return `<div class="row" style="margin-bottom:14px"><span class="lbl" style="color:var(--brass)">YENİ / DÜZENLE</span>
    <button class="del" id="cancelBtn">${svg(I.x,17)}</button></div>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function render(){
  drawNav();
  const v=document.getElementById('view');
  v.innerHTML = cur==='overview'?vOverview():cur==='yachts'?vYachts():cur==='routes'?vRoutes()
    :cur==='itins'?vItins():vFiles();
  wire();
}

/* ============ etkileşim ============ */
function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{cur=b.dataset.go;editing=null;render()});
  document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{editing={t:b.dataset.new,v:{id:uid()}};render()});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.edit, arr=t==='yacht'?D.yachts:t==='route'?D.routes:D.itins;
    editing={t,v:{...arr.find(x=>x.id===b.dataset.id)}};render()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Bu kayıt silinsin mi?'))return;
    const t=b.dataset.del;
    if(t==='yacht')D.yachts=D.yachts.filter(x=>x.id!==b.dataset.id);
    if(t==='route')D.routes=D.routes.filter(x=>x.id!==b.dataset.id);
    if(t==='itin')D.itins=D.itins.filter(x=>x.id!==b.dataset.id);
    await saveData();render()});
  const cb=document.getElementById('cancelBtn'); if(cb)cb.onclick=()=>{editing=null;render()};
  const sb=document.getElementById('saveBtn'); if(sb)sb.onclick=saveForm;

  const ph=document.getElementById('f_photo');
  if(ph)ph.onchange=e=>{const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{editing.v.photo=r.result;render()};r.readAsDataURL(f)};

  const up=document.getElementById('uploader');
  if(up)up.onchange=async e=>{
    for(const f of e.target.files){
      const rec={id:uid(),name:f.name,type:f.type||'application/octet-stream',blob:f,added:Date.now()};
      await idbPut('files',rec);
    }
    await loadFiles();render()};
  document.querySelectorAll('[data-delfile]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Bu dosya silinsin mi?'))return;
    await idbDel('files',b.dataset.delfile);await loadFiles();render()});
}

async function saveForm(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
  const t=editing.t, v=editing.v;
  if(t==='yacht'){
    Object.assign(v,{name:g('f_name'),type:g('f_type'),guests:g('f_guests'),
      speed:g('f_speed'),loa:g('f_loa'),port:g('f_port')});
    if(!v.name)return alert('Tekne adı gerekli.');
    D.yachts=upsert(D.yachts,v);
  }else if(t==='route'){
    Object.assign(v,{name:g('f_name'),region:g('f_region'),days:g('f_days'),stops:g('f_stops')});
    if(!v.name)return alert('Rota adı gerekli.');
    D.routes=upsert(D.routes,v);
  }else{
    Object.assign(v,{title:g('f_title'),yachtId:g('f_yachtId'),routeId:g('f_routeId'),
      dates:g('f_dates'),notes:g('f_notes')});
    if(!v.title)return alert('Başlık gerekli.');
    D.itins=upsert(D.itins,v);
  }
  await saveData();editing=null;render();
}
function upsert(arr,v){return arr.some(x=>x.id===v.id)?arr.map(x=>x.id===v.id?v:x):[...arr,v]}

async function loadFiles(){
  FILES.forEach(f=>f.url&&URL.revokeObjectURL(f.url));
  const recs=await idbAll('files');
  FILES=recs.map(r=>({...r,url:r.blob?URL.createObjectURL(r.blob):null}));
}

/* ============ yedekleme ============ */
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='yat-yonetim-yedek-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
};

/* ============ 2. Kaptan ============ */
const sheet=document.getElementById('sheet');
document.getElementById('fab').onclick=()=>{sheet.classList.add('on');drawMsgs();document.getElementById('chatIn').focus()};
document.getElementById('closeSheet').onclick=()=>sheet.classList.remove('on');
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('on')};

let CHAT=[];
function drawMsgs(){
  const box=document.getElementById('msgs');
  if(!localStorage.getItem('anthropic_key')){
    box.innerHTML=`<div class="hint">
      <p style="margin-bottom:12px"><strong style="color:var(--chart)">2. Kaptan'ı bağlamak için bir API anahtarı gerekli.</strong></p>
      <p style="margin-bottom:12px">console.anthropic.com adresinden bir anahtar oluşturup buraya yapıştırın. Anahtar yalnızca bu cihazda saklanır, hiçbir yere gönderilmez.</p>
      <input class="f" id="keyIn" type="password" placeholder="sk-ant-…" style="margin-bottom:10px">
      <button class="btn" id="keySave">Anahtarı Kaydet</button></div>`;
    document.getElementById('keySave').onclick=()=>{
      const k=document.getElementById('keyIn').value.trim();
      if(!k)return;localStorage.setItem('anthropic_key',k);drawMsgs()};
    return;
  }
  box.innerHTML=CHAT.length?CHAT.map(m=>`<div class="msg ${m.role==='user'?'me':m.role==='error'?'err':'cap'}">${esc(m.text)}</div>`).join('')
    :`<div class="hint">Rota planlama, hava değerlendirmesi, liman bilgisi, misafir programı, broşür metni — ne gerekiyorsa sorun. Uygulamadaki tekne, rota ve itinerary kayıtlarınızı görebiliyorum.</div>`;
  box.scrollTop=box.scrollHeight;
}
function ctx(){
  return `Kullanıcı bir yat kaptanı. Uygulamasındaki güncel kayıtlar:
TEKNELER: ${JSON.stringify(D.yachts.map(({photo,...y})=>y))}
ROTALAR: ${JSON.stringify(D.routes)}
İTİNERARYLER: ${JSON.stringify(D.itins)}
ARŞİVDEKİ DOSYALAR: ${FILES.map(f=>f.name).join(', ')||'yok'}`;
}
async function send(){
  const inp=document.getElementById('chatIn');
  const text=inp.value.trim(); if(!text)return;
  inp.value='';CHAT.push({role:'user',text});drawMsgs();
  CHAT.push({role:'assistant',text:'…'});drawMsgs();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'content-type':'application/json',
        'x-api-key':localStorage.getItem('anthropic_key'),
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:1500,
        system:`Sen bu kaptanın 2. kaptanısın. Denizcilik uzmanlığı ve yat işletme yönetimi perspektifiyle, Türkçe, net ve pratik cevap ver. Gereksiz uzatma.\n\n${ctx()}`,
        messages:CHAT.filter(m=>m.role!=='error'&&m.text!=='…').map(m=>({role:m.role,content:m.text}))
      })
    });
    const data=await res.json();
    CHAT.pop();
    if(data.error){CHAT.push({role:'error',text:'Hata: '+(data.error.message||'bilinmeyen')})}
    else{CHAT.push({role:'assistant',text:(data.content||[]).map(c=>c.text||'').join('\n').trim()||'(boş yanıt)'})}
  }catch(err){CHAT.pop();CHAT.push({role:'error',text:'Bağlantı kurulamadı: '+err.message})}
  drawMsgs();
}
document.getElementById('sendBtn').onclick=send;
document.getElementById('chatIn').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

/* ============ başlat ============ */
(async()=>{
  await openDB();
  const saved=await idbGet('kv','data');
  if(saved)D={yachts:saved.yachts||[],routes:saved.routes||[],itins:saved.itins||[]};
  await loadFiles();
  render();
})();
</script>
</body>
</html>
